<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Dashboard</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="dash" src="dashboard.html"></iframe><script>dash.onload=()=>{const w=dash.contentWindow,d=dash.contentDocument;const s=d.createElement('script');s.src='cloud-admin.js?v=2';d.body.appendChild(s);d.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent||'';if(/Copiar link privado/i.test(t)&&w.currentEventpic?.privateToken){e.preventDefault();e.stopImmediatePropagation();const u=location.origin+'/portal.html?token='+encodeURIComponent(w.currentEventpic.privateToken);try{await navigator.clipboard.writeText(u);alert('Link privado copiado.')}catch(_){prompt('Copia este link:',u)}}if(/Ver como os noivos/i.test(t)&&w.currentEventpic?.privateToken){e.preventDefault();e.stopImmediatePropagation();window.open(location.origin+'/portal.html?token='+encodeURIComponent(w.currentEventpic.privateToken),'_blank')}} ,true);};</script></body></html>
