<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Dashboard</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="dash" src="dashboard.html"></iframe><script>dash.onload=()=>{const w=dash.contentWindow,d=dash.contentDocument;d.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent||'';if(/Copiar link privado/i.test(t)){e.preventDefault();e.stopImmediatePropagation();const x=w.currentEventpic;if(!x||!x.privateToken)return alert('Abre primeiro um casamento.');const u=location.origin+'/portal.html?token='+encodeURIComponent(x.privateToken);try{await navigator.clipboard.writeText(u);alert('Link privado copiado.');}catch(_){prompt('Copia este link:',u)}}if(/Ver como os noivos/i.test(t)){e.preventDefault();e.stopImmediatePropagation();const x=w.currentEventpic;if(!x||!x.privateToken)return alert('Abre primeiro um casamento.');window.open(location.origin+'/portal.html?token='+encodeURIComponent(x.privateToken),'_blank')}} ,true);};</script></body></html>
