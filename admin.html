<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Dashboard Online</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f8fb;color:#17191d}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e5e7eb;padding:24px 16px}.logo{width:150px;margin:0 8px 28px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font-weight:800;margin:3px 0;cursor:pointer}.nav button.on{background:#eaf3ff;color:#0b73f6}main{padding:28px;max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.blue{background:#0b73f6;color:#fff}.light{background:#eef3f9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px}.card strong{display:block;font-size:28px;margin-top:7px}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden}.table th,.table td{padding:13px;border-bottom:1px solid #edf0f4;text-align:left}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:800}.toolbar{display:flex;gap:9px;margin:14px 0}.toolbar input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}.panel{display:none}.panel.on{display:block}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;place-items:center;padding:18px}.modal.on{display:grid}.box{background:#fff;border-radius:18px;padding:22px;width:min(800px,96vw);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;font-weight:800}.form input,.form textarea,.form select{width:100%;margin-top:5px;padding:10px;border:1px solid #d7dbe2;border-radius:9px}.span{grid-column:1/-1}.actions,.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions{justify-content:flex-end}.leadgrid{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;overflow:auto}.col{background:#eef1f5;border-radius:14px;padding:10px;min-height:220px}.lead{background:#fff;border-radius:11px;padding:11px;margin:8px 0}.auth{position:fixed;inset:0;background:#f6f8fb;z-index:99;display:grid;place-items:center}.authbox{width:min(420px,92vw);background:#fff;padding:28px;border-radius:20px}.authbox img{width:160px;display:block;margin:auto}.authbox input{width:100%;padding:12px;margin-top:9px;border:1px solid #ddd;border-radius:9px}@media(max-width:800px){.app{grid-template-columns:1fr}aside{padding:12px}.logo{margin-bottom:10px}.nav{display:flex}.stats,.form{grid-template-columns:1fr 1fr}main{padding:16px}.leadgrid{grid-template-columns:repeat(4,260px)}}</style></head><body><div id="auth" class="auth"><div class="authbox"><img src="eventpic-logo.png"><h2>Dashboard Eventpic</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn blue" style="width:100%;margin-top:10px" id="login">Entrar</button><p id="err"></p></div></div><div class="app"><aside><img class="logo" src="eventpic-logo.png"><div class="nav"><button class="on" data-p="weddings">📅 Casamentos</button><button data-p="leads">👥 Leads</button></div><button class="btn light" id="logout" style="margin-top:20px">Sair</button></aside><main><section id="weddings" class="panel on"><div class="top"><div><h1>Agenda de Casamentos</h1><div>Dados online · Supabase</div></div><button class="btn blue" id="newW">+ Novo casamento</button></div><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="Pesquisar noivos, local ou data..."><select id="statusFilter"><option>Todos</option><option>Por preencher</option><option>Em preenchimento</option><option>Concluído</option><option>Aprovado</option></select></div><div style="overflow:auto"><table class="table"><thead><tr><th>Data</th><th>Noivos</th><th>Local</th><th>Convidados</th><th>Faltam</th><th>Portal</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="leads" class="panel"><div class="top"><h1>Leads</h1><button class="btn blue" id="newL">+ Novo lead</button></div><div id="leadgrid" class="leadgrid"></div></section></main></div><div class="modal" id="wm"><div class="box"><h2 id="wt">Casamento</h2><div class="form"><label>Noivos<input id="wn"></label><label>Data<input id="wd" type="date"></label><label>Contacto<input id="wc"></label><label>Email<input id="we" type="email"></label><label>Local<input id="wv"></label><label>Convidados<input id="wg" type="number"></label><label>Equipa<input id="wteam"></label><label>Estado<select id="wps"><option>Por preencher</option><option>Em preenchimento</option><option>Concluído</option><option>Aprovado</option></select></label><label>Início<input id="wstart" type="time"></label><label>Chegada à quinta<input id="warrival" type="time"></label><label class="span">Morada<input id="wa"></label><label class="span">Pack / condições<textarea id="wcond"></textarea></label><label class="span">Observações<textarea id="wnotes"></textarea></label></div><div class="files" id="files"></div><div class="actions"><button class="btn light" id="cancelW">Cancelar</button><button class="btn light" id="copyW">Copiar link</button><button class="btn light" id="viewW">Ver portal</button><button class="btn blue" id="saveW">Guardar</button></div></div></div><div class="modal" id="lm"><div class="box"><h2>Novo lead</h2><div class="form"><label>Noivos<input id="ln"></label><label>Contacto<input id="lp"></label><label>Email<input id="le" type="email"></label><label>Data<input id="ld" type="date"></label><label>Origem<select id="lo"><option>Instagram</option><option>Facebook</option><option>Landing Page</option><option>Feira</option><option>Telefone</option><option>Outro</option></select></label><label>Campanha<input id="lc"></label></div><div class="actions"><button class="btn light" onclick="lm.classList.remove('on')">Cancelar</button><button class="btn blue" id="saveL">Guardar</button></div></div></div><script>const sb=supabase.createClient(EVENTPIC_SUPABASE_URL,EVENTPIC_SUPABASE_PUBLISHABLE_KEY);let weddings=[],leads=[],editId=null;const E=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function days(v){if(!v)return'—';let a=new Date(v+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);let n=Math.ceil((a-b)/86400000);return n===0?'Hoje':n>0?n+' dias':'Realizado'}async function guard(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let {data}=await sb.from('staff_users').select('active').eq('user_id',user.id).eq('active',true).maybeSingle();if(!data){await sb.auth.signOut();return}E('auth').style.display='none';await Promise.all([loadW(),loadL()])}E('login').onclick=async()=>{E('err').textContent='';let {error}=await sb.auth.signInWithPassword({email:E('email').value.trim(),password:E('pass').value});if(error)E('err').textContent='Email ou password inválidos.';else guard()};E('pass').onkeydown=e=>{if(e.key==='Enter')E('login').click()};E('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');E(b.dataset.p).classList.add('on')});async function loadW(){let {data,error}=await sb.from('weddings').select('*,personalizations(*)').order('wedding_date',{ascending:true});if(error)return alert(error.message);weddings=data||[];renderW()}function renderW(){let q=E('search').value.toLowerCase(),f=E('statusFilter').value,arr=weddings.filter(x=>(f==='Todos'||(x.portal_status||x.status)===f)&&([x.names,x.venue,x.wedding_date].join(' ').toLowerCase().includes(q)));E('stats').innerHTML=[['Total',weddings.length],['Por preencher',weddings.filter(x=>(x.portal_status||x.status)==='Por preencher').length],['Em preenchimento',weddings.filter(x=>(x.portal_status||x.status)==='Em preenchimento').length],['Concluídos/Aprovados',weddings.filter(x=>['Concluído','Aprovado'].includes(x.portal_status||x.status)).length]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');E('rows').innerHTML=arr.length?arr.map(x=>`<tr><td>${esc(x.wedding_date||'—')}</td><td><b>${esc(x.names||'Sem nome')}</b></td><td>${esc(x.venue||'—')}</td><td>${esc(x.guests||'—')}</td><td>${days(x.wedding_date)}</td><td><span class="pill">${esc(x.portal_status||x.status||'Por preencher')}</span></td><td><button class="btn light" onclick="openW('${x.id}')">Abrir</button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:30px">Ainda não existem casamentos.</td></tr>'}E('search').oninput=renderW;E('statusFilter').onchange=renderW;E('newW').onclick=()=>openW();window.openW=async id=>{let x=weddings.find(v=>v.id===id);editId=id||null;E('wt').textContent=x?'Editar casamento':'Novo casamento';[['wn','names'],['wd','wedding_date'],['wc','contact'],['we','email'],['wv','venue'],['wg','guests'],['wteam','team'],['wps','portal_status'],['wstart','start_time'],['warrival','arrival_time'],['wa','address'],['wcond','conditions'],['wnotes','notes']].forEach(([a,b])=>E(a).value=x?.[b]??(a==='wps'?'Por preencher':''));E('copyW').style.display=x?'':'none';E('viewW').style.display=x?'':'none';E('files').innerHTML='';E('wm').classList.add('on');if(x){let p=Array.isArray(x.personalizations)?x.personalizations[0]:x.personalizations;if(p)for(let [lab,path] of [['Foto original',p.original_photo_url],['Foto vertical',p.vertical_photo_url],['Símbolo a cores',p.logo_color_url],['Símbolo branco',p.logo_white_url]])if(path){let {data}=await sb.storage.from('wedding-assets').createSignedUrl(path,3600);if(data?.signedUrl)E('files').insertAdjacentHTML('beforeend',`<a class="btn light" target="_blank" href="${data.signedUrl}">${lab}</a>`)}}};E('cancelW').onclick=()=>E('wm').classList.remove('on');E('saveW').onclick=async()=>{let p={names:E('wn').value.trim(),wedding_date:E('wd').value||null,contact:E('wc').value.trim()||null,email:E('we').value.trim()||null,venue:E('wv').value.trim()||null,guests:E('wg').value?+E('wg').value:null,team:E('wteam').value.trim()||null,portal_status:E('wps').value,status:E('wps').value,start_time:E('wstart').value||null,arrival_time:E('warrival').value||null,address:E('wa').value.trim()||null,conditions:E('wcond').value.trim()||null,notes:E('wnotes').value.trim()||null,updated_at:new Date().toISOString()};let r=editId?await sb.from('weddings').update(p).eq('id',editId):await sb.from('weddings').insert(p);if(r.error)return alert('Erro: '+r.error.message);E('wm').classList.remove('on');await loadW()};function link(){let x=weddings.find(v=>v.id===editId);return x?location.origin+'/noivos?token='+encodeURIComponent(x.private_token):null}E('copyW').onclick=async()=>{let u=link();if(!u)return;try{await navigator.clipboard.writeText(u);alert('Link privado copiado.')}catch(_){prompt('Copia o link:',u)}};E('viewW').onclick=()=>{let u=link();if(u)open(u,'_blank')};async function loadL(){let {data}=await sb.from('leads').select('*').order('created_at',{ascending:false});leads=data||[];renderL()}function renderL(){let stages=['Novo lead','Contactado','Convertido','Fechado'];E('leadgrid').innerHTML=stages.map(s=>`<div class="col"><b>${s} · ${leads.filter(x=>x.status===s).length}</b>${leads.filter(x=>x.status===s).map(x=>`<div class="lead"><b>${esc(x.names)}</b><small><br>${esc(x.phone||x.email||'Sem contacto')}<br>${esc(x.wedding_date||'Data por definir')} · ${esc(x.origin||'')}</small><div style="margin-top:8px"><select onchange="moveL('${x.id}',this.value)">${stages.map(v=>`<option ${v===x.status?'selected':''}>${v}</option>`).join('')}</select> ${s==='Convertido'?`<button class="btn light" onclick="convertL('${x.id}')">Criar casamento</button>`:''}</div></div>`).join('')}</div>`).join('')}window.moveL=async(id,status)=>{await sb.from('leads').update({status,updated_at:new Date().toISOString()}).eq('id',id);loadL()};window.convertL=async id=>{let x=leads.find(v=>v.id===id);if(!x)return;let {error}=await sb.from('weddings').insert({names:x.names,contact:x.phone||null,email:x.email||null,wedding_date:x.wedding_date||null,origin:x.origin||null,status:'Por preencher',portal_status:'Por preencher'});if(error)return alert(error.message);await sb.from('leads').update({status:'Fechado'}).eq('id',id);await Promise.all([loadW(),loadL()]);alert('Casamento criado na agenda.')};E('newL').onclick=()=>E('lm').classList.add('on');E('saveL').onclick=async()=>{let {error}=await sb.from('leads').insert({names:E('ln').value.trim(),phone:E('lp').value.trim()||null,email:E('le').value.trim()||null,wedding_date:E('ld').value||null,origin:E('lo').value,campaign:E('lc').value.trim()||null,status:'Novo lead'});if(error)return alert(error.message);E('lm').classList.remove('on');await loadL()};guard();</script></body></html>
