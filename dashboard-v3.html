<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Dashboard</title><style>html,body,#dash{width:100%;height:100%;margin:0;border:0;display:block}</style></head><body><iframe id="dash" src="/admin-v2.html"></iframe><script>const f=document.getElementById('dash');function setup(){let d=f.contentDocument,w=f.contentWindow;if(!d)return;let actions=d.querySelector('#wm .actions');if(!actions)return;if(!d.getElementById('whatsappPersonalizacao')){let b=d.createElement('button');b.id='whatsappPersonalizacao';b.className='btn';b.type='button';b.textContent='💬 Iniciar conversa de personalização';b.style.background='#25D366';b.style.color='#fff';b.style.display='none';b.onclick=()=>{let phone=(d.getElementById('wc')?.value||'').replace(/\D/g,'');if(!phone)return alert('Este casamento não tem número de telefone.');if(phone.startsWith('00'))phone=phone.slice(2);if(phone.length===9)phone='351'+phone;let names=(d.getElementById('wn')?.value||'').trim();let portal=typeof w.link==='function'?w.link():'';if(!portal)return alert('Guarda primeiro o casamento para gerar o link privado.');let msg=`Olá${names?' '+names:''}! 😊 Somos da Eventpic. Está na altura de prepararmos a personalização do vosso casamento.\n\nAtravés deste link podem confirmar os dados do evento e enviar a fotografia e o símbolo/logótipo para personalização:\n${portal}\n\nQualquer dúvida, estamos disponíveis. 📸`;w.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')};let save=d.getElementById('saveW');actions.insertBefore(b,save)}let btn=d.getElementById('whatsappPersonalizacao'),modal=d.getElementById('wm');let sync=()=>{if(!btn||!modal)return;let editing=d.getElementById('copyW')?.style.display!=='none';btn.style.display=modal.classList.contains('on')&&editing?'':'none'};new MutationObserver(sync).observe(modal,{attributes:true,attributeFilter:['class']});let copy=d.getElementById('copyW');if(copy)new MutationObserver(sync).observe(copy,{attributes:true,attributeFilter:['style']});sync()}f.addEventListener('load',()=>{setup();setTimeout(setup,500)});</script></body></html>
