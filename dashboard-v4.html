"span">Morada<input id="wa"></label><label class="span">Pack / condições<textarea id="wcond"></textarea></label><label class="span">Observações<textarea id="wnotes"></textarea></label></div><h3>Checklist do evento</h3><div class="checkgrid" id="checks"></div><div class="quick"><button class="btn green" id="waStart">💬 Iniciar personalização</button><button class="btn green" id="waRemind">💬 Lembrar material</button><button class="btn green" id="waApprove">💬 Enviar para aprovação</button><button class="btn green" id="waPre">💬 Mensagem pré-casamento</button><button class="btn light" id="copyW">Copiar link</button><button class="btn light" id="viewW">Ver portal</button><button class="btn light" id="sheetW">📋 Ficha do evento</button></div><div class="files" id="files"></div><div class="actions"><button class="btn danger" id="deleteW">Eliminar</button><button class="btn light" id="cancelW">Cancelar</button><button class="btn blue" id="saveW">Guardar</button></div></div></div><div class="modal" id="sm"><div class="modalbox"><div class="top"><h2>Ficha do Evento</h2><button class="btn blue" onclick="window.print()">Imprimir</button></div><div id="sheet" class="sheet"></div><div class="actions"><button class="btn light" onclick="E('sm').classList.remove('on')">Fechar</button></div></div></div><div class="modal" id="lm"><div class="modalbox"><h2>Novo lead</h2><div class="form"><label>Noivos<input id="ln"></label><label>Contacto<input id="lp"></label><label>Email<input id="le" type="email"></label><label>Data<input id="ld" type="date"></label><label>Origem<select id="lo"><option>Instagram</option><option>Facebook</option><option>Landing Page</option><option>Feira</option><option>Telefone</option><option>Outro</option></select></label><label>Campanha<input id="lc"></label></div><div class="actions"><button class="btn light" id="cancelL">Cancelar</button><button class="btn blue" id="saveL">Guardar</button></div></div></div><script>const sb=supabase.createClient(EVENTPIC_SUPABASE_URL,EVENTPIC_SUPABASE_PUBLISHABLE_KEY),E=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let weddings=[],leads=[],editId=null,currentFiles=[],calDate=new Date();const CK=[['photo_received','Foto recebida'],['logo_received','Logo recebido'],['personalization_ready','Personalização pronta'],['personalization_approved','Personalização aprovada'],['team_defined','Equipa definida'],['schedule_confirmed','Horário confirmado'],['address_confirmed','Morada confirmada'],['equipment_ready','Material preparado'],['print_tested','Impressão testada'],['usb_ready','Pen preparada']];function dleft(v){if(!v)return null;let a=new Date(v+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.ceil((a-b)/86400000)}function pack(v){return(v||'—').split(/\n|,|\r/)[0].trim()||'—'}function pct(x){let c=x.checklist||{},n=CK.filter(([k])=>c[k]).length;return n*10}function alertText(x){let n=dleft(x.wedding_date);if(n==null||n<0)return'';if(n<=7&&pct(x)<100)return'🚨 Evento próximo';if(n<=20&&['Por iniciar','Contactado'].includes(x.preparation_status||'Por iniciar'))return'⚠️ Personalização em falta';return''}function phone(v){let n=String(v||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.length===9)n='351'+n;return n}function link(x){return location.origin+'/noivos?token='+encodeURIComponent(x.private_token)}function whatsapp(x,msg){let p=phone(x?.contact);if(!p)return alert('Este casamento não tem telefone.');open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}function msg(kind,x){let u=link(x),name=x.names||'noivos';if(kind==='start')return`Olá ${name}! 😊 Somos da Eventpic. Está na altura de prepararmos a personalização do vosso casamento. Através deste link podem confirmar os dados e enviar a fotografia e o logótipo: ${u} Qualquer dúvida, estamos disponíveis. 📸`;if(kind==='remind')return`Olá ${name}! 😊 Só um lembrete da Eventpic: ainda precisamos de concluir o material da personalização do vosso casamento. Podem enviar tudo aqui: ${u} Obrigado!`;if(kind==='approve')return`Olá ${name}! 😊 A personalização Eventpic está pronta para validação. Podem consultar através do vosso portal: ${u} Digam-nos se está tudo aprovado ou se pretendem alguma alteração.`;return`Olá ${name}! 😊 Está quase a chegar o grande dia! Da parte da Eventpic estamos a finalizar a preparação. Pedimos apenas que confirmem se os dados, horário e local continuam corretos. Até breve! 📸`};async function guard(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let {data}=await sb.from('staff_users').select('active').eq('user_id',user.id).eq('active',true).maybeSingle();if(!data){await sb.auth.signOut();return}E('auth').style.display='none';await Promise.all([loadW(),loadL()])}E('login').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:E('email').value.trim(),password:E('pass').value});if(error)E('err').textContent='Email ou password inválidos.';else guard()};E('pass').onkeydown=e=>{if(e.key==='Enter')E('login').click()};E('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');E(b.dataset.p).classList.add('on');if(b.dataset.p==='calendar')renderCal();if(b.dataset.p==='business')renderBiz()});async function loadW(){let {data,error}=await sb.from('weddings').select('*,personalizations(*)').order('wedding_date',{ascending:true});if(error)return alert(error.message);weddings=data||[];renderW();renderCal();renderBiz()}function renderW(){let q=E('search').value.toLowerCase(),f=E('prepFilter').value,arr=weddings.filter(x=>(f==='Todos'||(x.preparation_status||'Por iniciar')===f)&&[x.names,x.contact,x.conditions,x.venue,x.wedding_date].join(' ').toLowerCase().includes(q));let alerts=weddings.fil paration_status'],['wstart','start_time'],['warrival','arrival_time'],['wvalue','estimated_value'],['wps','portal_status'],['wa','address'],['wcond','conditions'],['wnotes','notes']];fields.forEach(([a,b])=>E(a).value=x?.[b]??(a==='wprep'?'Por iniciar':a==='wps'?'Por preencher':''));let c=x?.checklist||{};E('checks').innerHTML=CK.map(([k,l])=>`<label><input type="checkbox" data-ck="${k}" ${c[k]?'checked':''}> ${l}</label>`).join('');['waStart','waRemind','waApprove','waPre','copyW','viewW','sheetW','deleteW'].forEach(a=>E(a).style.display=x?'':'none');E('alertBox').innerHTML=x&&alertText(x)?`<span class="pill warn">${alertText(x)}</span>`:'';E('files').innerHTML='';E('wm').classList.add('on');if(x){let p=Array.isArray(x.personalizations)?x.personalizations[0]:x.personalizations;if(p)for(let [lab,path] of [['Foto original',p.original_photo_url],['Foto vertical',p.vertical_photo_url],['Logo a cores',p.logo_color_url],['Logo branco',p.logo_white_url]])if(path){let u=await signed(path);if(u){currentFiles.push({lab,u});E('files').insertAdjacentHTML('beforeend',`<div class="fileline"><b>${lab}</b><span><a class="btn light" target="_blank" href="${u}">Ver</a> <a class="btn light" href="${u}" download>⬇ Descarregar</a></span></div>`)}}if(currentFiles.length)E('files').insertAdjacentHTML('afterbegin','<button class="btn blue" onclick="downloadAll()">⬇ Descarregar tudo</button>')}};window.downloadAll=async()=>{for(let f of currentFiles){let a=document.createElement('a');a.href=f.u;a.download=f.lab;a.click();await new Promise(r=>setTimeout(r,300))}};E('cancelW').onclick=()=>E('wm').classList.remove('on');E('saveW').onclick=async()=>{let checklist={};document.querySelectorAll('[data-ck]').forEach(c=>checklist[c.dataset.ck]=c.checked);let p={names:E('wn').value.trim(),wedding_date:E('wd').value||null,contact:E('wc').value.trim()||null,email:E('we').value.trim()||null,venue:E('wv').value.trim()||null,guests:E('wg').value?+E('wg').value:null,team:E('wteam').value.trim()||null,prep
