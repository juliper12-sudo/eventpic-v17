<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Disponibilidade</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:25px}.logo{width:170px;display:block;margin:10px auto 28px}.hero,.card{background:#fff;border:1px solid #e4eaf2;border-radius:20px;padding:20px;box-shadow:0 10px 30px #1b2d4e0d}.hero h1{margin:0 0 8px}.hero p{color:#738095}.card{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:15px}.card small{display:block;color:#778397;margin-top:4px}.buttons{display:flex;gap:7px}.buttons button{border:1px solid #dfe5ed;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.buttons .yes.on{background:#e6f8ee;color:#137946;border-color:#bdebd1}.buttons .no.on{background:#feeaea;color:#b42318;border-color:#f4c7c7}.msg{text-align:center;color:#6e7a8d;padding:25px}@media(max-width:600px){.card{align-items:stretch;flex-direction:column}.buttons button{flex:1}.buttons{width:100%}}</style></head><body><div class="wrap"><img src="eventpic-logo.png" class="logo"><div class="hero"><h1>Disponibilidade da Equipa</h1><p id="event">A carregar evento…</p></div><div id="list" class="msg">A carregar…</div></div><script>const sb=supabase.createClient(EVENTPIC_SUPABASE_URL,EVENTPIC_SUPABASE_PUBLISHABLE_KEY),E=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');async function load(){if(!token)return E('list').innerHTML='Link inválido.';let{data,error}=await sb.rpc('get_team_availability_by_token',{p_token:token});if(error||!data?.length)return E('list').innerHTML='Não foi possível encontrar este evento.';let x=data[0];E('event').textContent=`${x.wedding_names} · ${x.wedding_date}${x.venue?' · '+x.venue:''}`;E('list').className='';E('list').innerHTML=data.map(m=>`<div class="card"><div><b>${m.member_name}</b><small>Seleciona a tua disponibilidade</small></div><div class="buttons"><button class="yes ${m.availability==='Disponível'?'on':''}" onclick="setA('${m.member_id}','Disponível')">✓ Disponível</button><button class="no ${m.availability==='Indisponível'?'on':''}" onclick="setA('${m.member_id}','Indisponível')">✕ Indisponível</button></div></div>`).join('')}window.setA=async(id,a)=>{let{error}=await sb.rpc('set_team_availability_by_token',{p_token:token,p_member_id:id,p_availability:a});if(error)return alert(error.message);load()};load();</script></body></html>
