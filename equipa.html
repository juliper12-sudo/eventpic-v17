<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Disponibilidade</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f9fc;font-family:Inter,Arial,sans-serif;color:#14213a}.wrap{max-width:650px;margin:auto;padding:24px 16px 45px}.logo{width:185px;display:block;margin:5px auto 25px}.hero{background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:22px;box-shadow:0 8px 28px #192d4b0d}.hero h1{font-size:25px;margin:0 0 7px}.hero p{margin:0;color:#748096}.privacy{margin-top:10px;font-size:12px;color:#8490a2}.section-title{font-size:20px;margin:25px 3px 10px}.card{background:#fff;border:1px solid #e4eaf2;border-radius:15px;padding:17px;margin-top:11px;box-shadow:0 5px 18px #192d4b0a}.date{font-size:11px;font-weight:800;color:#0875ef;text-transform:uppercase;letter-spacing:.5px}.card h3{margin:6px 0 8px;font-size:18px}.meta{display:flex;flex-wrap:wrap;gap:7px 14px;color:#66758d;font-size:13px;margin-bottom:14px}.pack{display:inline-flex;align-items:center;background:#edf5ff;color:#1266bd;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{border:1px solid #dfe5ed;background:#fff;border-radius:10px;padding:12px;font-weight:700}.buttons button:disabled{opacity:.45}.msg{text-align:center;color:#6e7a8d;padding:30px;background:#fff;border-radius:13px;margin-top:12px}.hint{font-size:11px;color:#8793a5;margin-top:9px;text-align:center}.foot{text-align:center;color:#718096;font-size:12px;margin:25px 0}@media(max-width:480px){.buttons{grid-template-columns:1fr}.hero h1{font-size:23px}}</style></head><body><div class="wrap"><img src="eventpic-logo.png" class="logo"><div class="hero"><h1>Disponibilidade da Equipa</h1><p>Próximos eventos Eventpic.</p><div class="privacy">Aqui só aparecem data, evento, local e Pack. Para registar a tua resposta usa o teu link pessoal.</div></div><h2 class="section-title">Próximos eventos</h2><div id="list" class="msg">A carregar…</div><div class="foot">Obrigado por fazeres parte da nossa equipa!</div></div><script>const sb=supabase.createClient(EVENTPIC_SUPABASE_URL,EVENTPIC_SUPABASE_PUBLISHABLE_KEY),E=id=>document.getElementById(id);const fmt=d=>new Intl.DateTimeFormat('pt-PT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00'));async function load(){let{data,error}=await sb.rpc('get_public_team_events');if(error)return E('list').innerHTML='Não foi possível carregar os eventos.';if(!data?.length)return E('list').innerHTML='Não existem eventos futuros.';E('list').className='';E('list').innerHTML=data.map(x=>`<div class="card"><div class="date">${fmt(x.wedding_date)}</div><h3>${x.wedding_names}</h3><div class="meta">${x.venue?`<span>📍 ${x.venue}</span>`:''}${x.package_name?`<span class="pack">📦 Pack ${x.package_name}</span>`:''}</div><div class="buttons"><button disabled>✓ Estou disponível</button><button disabled>✕ Não estou disponível</button></div><div class="hint">Abre o teu link pessoal para registar a disponibilidade.</div></div>`).join('')}load();</script></body></html>
