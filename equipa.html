<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Disponibilidade</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f9fc;font-family:Inter,Arial,sans-serif;color:#14213a}.wrap{max-width:620px;margin:auto;padding:28px 18px}.logo{width:180px;display:block;margin:6px auto 28px}.hero{background:#fff;border:1px solid #e4eaf2;border-radius:14px;padding:22px;box-shadow:0 8px 28px #192d4b0d}.hero h1{font-size:24px;margin:0 0 6px}.hero p{margin:0;color:#748096}.privacy{margin-top:10px;font-size:12px;color:#8490a2}.card{background:#fff;border:1px solid #e4eaf2;border-radius:13px;padding:17px;margin-top:11px;box-shadow:0 5px 18px #192d4b0a}.date{font-size:11px;font-weight:800;color:#0875ef;text-transform:uppercase;letter-spacing:.5px}.card h3{margin:6px 0 14px;font-size:17px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{border:1px solid #dfe5ed;background:#fff;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}.yes.on{background:#e8f8ef;color:#137946;border-color:#bdebd1}.no.on{background:#feeaea;color:#b42318;border-color:#f4c7c7}.msg{text-align:center;color:#6e7a8d;padding:30px;background:#fff;border-radius:13px;margin-top:12px}.saved{font-size:11px;color:#16814a;margin-top:9px;text-align:center}@media(max-width:480px){.buttons{grid-template-columns:1fr}}</style></head><body><div class="wrap"><img src="eventpic-logo.png" class="logo"><div class="hero"><h1 id="title">Disponibilidade</h1><p>Indica apenas se estás disponível para cada evento.</p><div class="privacy">Não tens acesso a contactos, valores, personalizações, notas ou outras informações dos clientes.</div></div><div id="list" class="msg">A carregar…</div></div><script>const sb=supabase.createClient(EVENTPIC_SUPABASE_URL,EVENTPIC_SUPABASE_PUBLISHABLE_KEY),E=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');const fmt=d=>new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'));async function load(){if(!token)return E('list').innerHTML='Este link não é válido.';let{data,error}=await sb.rpc('get_team_availability_by_member_token',{p_token:token});if(error)return E('list').innerHTML='Não foi possível abrir a disponibilidade.';if(!data?.length)return E('list').innerHTML='Não existem eventos futuros para responder.';E('title').textContent='Olá, '+data[0].member_name;E('list').className='';E('list').innerHTML=data.map(x=>`<div class="card"><div class="date">${fmt(x.wedding_date)}</div><h3>${x.wedding_names}</h3><div class="buttons"><button class="yes ${x.availability==='Disponível'?'on':''}" onclick="setA('${x.wedding_id}','Disponível')">✓ Estou disponível</button><button class="no ${x.availability==='Indisponível'?'on':''}" onclick="setA('${x.wedding_id}','Indisponível')">✕ Não estou disponível</button></div>${x.availability!=='Por responder'?'<div class="saved">Resposta registada</div>':''}</div>`).join('')}window.setA=async(id,a)=>{let{data,error}=await sb.rpc('set_team_availability_by_member_token',{p_token:token,p_wedding_id:id,p_availability:a});if(error||!data)return alert('Não foi possível guardar.');load()};load();</script></body></html>
