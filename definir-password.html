<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Definir password</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;min-height:100vh;display:grid;place-items:center;color:#172033}.box{width:min(430px,92vw);background:#fff;padding:30px;border-radius:22px;box-shadow:0 25px 70px #1b2d4e1f;border:1px solid #e6ebf2}.logo{width:170px;display:block;margin:0 auto 25px}h1{font-size:25px;margin:0 0 8px}p{color:#69768a;line-height:1.5}.field{margin-top:14px}label{font-size:12px;font-weight:700;color:#68758b}input{width:100%;padding:12px;margin-top:6px;border:1px solid #dce3ec;border-radius:10px;font-size:15px}.btn{width:100%;border:0;border-radius:11px;padding:12px;margin-top:16px;background:#0875ef;color:#fff;font-weight:800;cursor:pointer}.light{background:#eef3f8;color:#334155}.msg{margin-top:14px;font-size:14px}.ok{color:#14804a}.bad{color:#b42318}.hide{display:none}</style></head><body><div class="box"><img src="eventpic-logo.png" class="logo"><div id="request"><h1>Definir password</h1><p>Introduz o email associado à tua conta Eventpic. Vais receber um email com um link seguro para escolheres a tua password.</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="nome@eventpic.pt"></div><button id="send" class="btn">Enviar link para definir password</button><div id="requestMsg" class="msg"></div><button class="btn light" onclick="location.href='/dashboard'">Voltar ao login</button></div><div id="change" class="hide"><h1>Escolher nova password</h1><p>Define agora a password que vais utilizar para entrar no Dashboard Eventpic.</p><div class="field"><label>Nova password</label><input id="p1" type="password" minlength="8"></div><div class="field"><label>Confirmar password</label><input id="p2" type="password" minlength="8"></div><button id="save" class="btn">Guardar password</button><div id="changeMsg" class="msg"></div></div></div><script>const sb=supabase.createClient(EVENTPIC_SUPABASE_URL,EVENTPIC_SUPABASE_PUBLISHABLE_KEY),E=id=>document.getElementById(id);async function recoveryMode(){const {data:{session}}=await sb.auth.getSession();if(session){E('request').classList.add('hide');E('change').classList.remove('hide')}}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){E('request').classList.add('hide');E('change').classList.remove('hide')}});E('send').onclick=async()=>{let email=E('email').value.trim();if(!email)return E('requestMsg').innerHTML='<span class="bad">Introduz o email.</span>';E('send').disabled=true;let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/definir-password.html'});E('send').disabled=false;if(error)E('requestMsg').innerHTML='<span class="bad">'+error.message+'</span>';else E('requestMsg').innerHTML='<span class="ok">Email enviado. Abre o email da Eventpic e carrega no link para definires a password.</span>'};E('save').onclick=async()=>{let a=E('p1').value,b=E('p2').value;if(a.length<8)return E('changeMsg').innerHTML='<span class="bad">A password deve ter pelo menos 8 caracteres.</span>';if(a!==b)return E('changeMsg').innerHTML='<span class="bad">As passwords não são iguais.</span>';let {error}=await sb.auth.updateUser({password:a});if(error)return E('changeMsg').innerHTML='<span class="bad">'+error.message+'</span>';E('changeMsg').innerHTML='<span class="ok">Password definida com sucesso. A entrar no dashboard…</span>';setTimeout(()=>location.href='/dashboard',1200)};recoveryMode();</script></body></html>
