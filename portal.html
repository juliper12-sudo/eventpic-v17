<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventpic — Portal dos Noivos</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}#msg{display:none;position:fixed;inset:0;background:#fff;z-index:9;font:16px Arial;place-items:center;text-align:center;padding:30px}</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="msg"></div><iframe id="app" src="index.html"></iframe><script>
const token=new URLSearchParams(location.search).get('token');const sb=window.supabase.createClient(window.EVENTPIC_SUPABASE_URL,window.EVENTPIC_SUPABASE_PUBLISHABLE_KEY);const frame=document.getElementById('app');function fail(t){msg.style.display='grid';msg.textContent=t;frame.style.display='none'}function setv(d,id,v){const e=d.getElementById(id);if(e&&v!=null)e.value=v}function socialBool(v){if(/^(sim|yes|true)$/i.test(v||''))return true;if(/^(não|nao|no|false)$/i.test(v||''))return false;return null}function ext(f){return ((f&&f.name||'file').split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase()}
function centerBrand(d){const s=d.createElement('style');s.textContent='.top{position:relative!important;justify-content:center!important;min-height:112px!important}.brand{width:100%!important;display:flex!important;justify-content:center!important;align-items:center!important;text-align:center!important}.brand img{display:block!important;margin:0 auto!important;width:min(320px,78vw)!important;max-width:100%!important;height:auto!important}.top>.tag{position:absolute!important;right:6%!important}@media(max-width:800px){.top{padding:18px 4%!important;min-height:96px!important}.brand img{width:min(285px,84vw)!important}.top>.tag{display:none!important}}';d.head.appendChild(s)}
async function upload(file,name){if(!file)return null;const path=token+'/'+name+'.'+ext(file);const {error}=await sb.storage.from('wedding-assets').upload(path,file,{upsert:true,contentType:file.type||undefined});if(error)throw error;return path}
frame.onload=async()=>{const d=frame.contentDocument,w=frame.contentWindow;centerBrand(d);if(!token)return fail('Link privado inválido. Pede à Eventpic um novo link.');const {data,error}=await sb.rpc('get_wedding_by_token',{p_token:token});const x=Array.isArray(data)?data[0]:data;if(error||!x)return fail('Este link não é válido ou já não está disponível.');setv(d,'names',x.names);setv(d,'date',x.wedding_date);setv(d,'start',x.start_time);setv(d,'arrival',x.arrival_time);setv(d,'guests',x.guests);setv(d,'venue',x.venue);setv(d,'address',x.address);if(x.social_permission!=null)setv(d,'social',x.social_permission?'Sim':'Não');if(d.getElementById('cropX')&&x.crop_x!=null){d.getElementById('cropX').value=x.crop_x;try{w.applyCrop()}catch(e){}}
w.confirmData=async()=>{const v=w.vals();try{const photo=d.getElementById('photoInput')?.files?.[0]||null,logo=d.getElementById('logoInput')?.files?.[0]||null;const original=await upload(photo,'original-photo');const logoColor=await upload(logo,'logo-color');const {data:ok,error:e}=await sb.rpc('submit_wedding_by_token',{p_token:token,p_names:v.names||null,p_wedding_date:v.date||null,p_venue:v.venue||null,p_address:v.address||null,p_guests:v.guests?Number(v.guests):null,p_start_time:v.start||null,p_arrival_time:v.arrival||null,p_social_permission:socialBool(v.social),p_crop_x:d.getElementById('cropX')?Number(d.getElementById('cropX').value):50});if(e||ok!==true)throw e||new Error('Falha ao guardar');if(original||logoColor){const {error:a}=await sb.rpc('record_wedding_assets_by_token',{p_token:token,p_original:original,p_logo_color:logoColor});if(a)throw a}alert('Personalização e ficheiros enviados à Eventpic com sucesso.');}catch(err){console.error(err);alert('Não foi possível enviar tudo. Confirma a ligação e tenta novamente.');}};};
</script></body></html>
